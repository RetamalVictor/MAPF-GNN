# Data-volume control: does baseline_dense win because it saw more obstacle
# densities, or simply because it saw more cases?
#
# This trains the same no-communication network on a comparable pile of data
# that is ALL at 2% obstacles - 1,182 cases from the original set plus the 488
# at 2% from the new one. The original set was recorded with a different sensing
# range, which does not matter here: a baseline has no graph and never reads the
# recorded adjacency at all.
#
# If this lands near baseline_dense, the gain was volume. If it lands near
# baseline_a10b20, the gain was density variety.
exp_name: baseline_vol2pct
channels:
- 16
- 16
- 16
strides:
- 1
- 1
- 1
- 1
- 1
encoder_layers: 1
last_convs:
- 400
encoder_dims:
- 64
graph_filters:
- 3
node_dims:
- 128
action_layers: 1
epochs: 50
tests_episodes: 25
net_type: baseline
msg_type: gcn
board_size:
- 20
- 20
map_shape:
- 5
- 5
num_agents: 10
obstacles: 8
max_steps: 32
max_time: 32
sensing_range: 8
max_neighbours: ~
min_time: 1
num_workers: 3
batch_size: 128
train:
  root_dir:
  - dataset/10_8_20
  - dataset/dense_r8/10_8_20
  mode: train
  min_time: 5
  max_time_dl: 60
  nb_agents: 10
