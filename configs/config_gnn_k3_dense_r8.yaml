# GCN K=3 trained across four obstacle densities, with a wider radio and no
# neighbour cap.
#
# Three changes from config_gnn_k3_a10b20, all measured rather than guessed:
#
#   sensing_range 4 -> 8   With the cap removed a wider radio finally adds
#                          neighbours instead of swapping near ones for far.
#                          Mean degree at ten robots goes 0.9 -> 3.2, and at a
#                          hundred robots 1.9 -> 5.7.
#   max_neighbours 4 -> ~  Aggregating over everything in range is what the
#                          graph filter is for; D^-1/2 (A+I) D^-1/2 is exactly
#                          what makes a varying degree safe. The old cap threw
#                          away more than half the links at deployment scale.
#   one density -> four    2%, 5%, 10% and 15% of the board. The demo has a
#                          density slider, and a policy trained on one density
#                          is extrapolating the moment anyone drags it.
exp_name: gnn_k3_dense_r8
channels:
- 16
- 16
- 16
strides:
- 1
- 1
- 1
- 1
- 1
encoder_layers: 1
last_convs:
- 400
encoder_dims:
- 64
graph_filters:
- 3
node_dims:
- 128
action_layers: 1
epochs: 50
tests_episodes: 25
net_type: gnn
msg_type: gcn
board_size:
- 20
- 20
map_shape:
- 5
- 5
num_agents: 10
obstacles: 8
max_steps: 32
max_time: 32
sensing_range: 8
max_neighbours: ~
min_time: 1
num_workers: 3
batch_size: 128
train:
  root_dir:
  - dataset/dense_r8/o8
  - dataset/dense_r8/o20
  - dataset/dense_r8/o40
  - dataset/dense_r8/o60
  mode: train
  min_time: 5
  max_time_dl: 60
  nb_agents: 10
